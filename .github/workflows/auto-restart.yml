name: Auto-Restart After Quota Reset

on:
  schedule:
    # Run at 12:30 AM Pacific Time (8:30 AM UTC) - 30 minutes after quota resets
    - cron: '30 8 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  clean-restart:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth google-generativeai gspread
      
      - name: Clear sheet and sync last 10 emails
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
        run: |
          python gmail_sync.py --clear
          python backfill_data.py
